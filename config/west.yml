manifest:
  version: 1.2
  defaults:
    remote: cormoran
    revision: main
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tokyo2006
      url-base: https://github.com/tokyo2006
    - name: a741725193
      url-base: https://github.com/a741725193
    - name: S7venYoung
      url-base: https://github.com/S7venYoung
  projects:
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml
      clone-depth: 1
    - name: zephyr
      remote: cormoran
      revision: v4.1.0+zmk-fixes+nrf-half-duplex-uart
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
          - chre
    # ---- ZMK 4.1 DYA feature modules ----

    # Trackball: PMW3610 (custom Studio RPC driver)
    - name: zmk-driver-pmw3610-with-custom-studio-rpc
      import: true
    # TPS43 touchpad (Azoteq IQS5xx) + Studio RPC
    - name: tps43-input-module
      remote: tokyo2006
      import: true
    # Battery-level RGB indicator LED
    - name: zmk-battery-rgb
      remote: tokyo2006
    - name: zmk-behavior-runtime-sensor-rotate
      import: true
    - name: zmk-module-ble-management
      import: true
    - name: zmk-module-battery-history
    - name: zmk-module-settings-rpc
      import: true
    - name: zmk-module-runtime-input-processor
      import: true
    - name: zmk-feature-custom-settings
      import: true
    - name: zmk-feature-fast-keymap
      import: true
    - name: zmk-feature-device-info
      import: true
    - name: zmk-feature-watchdog
    - name: zmk-feature-input-stream
    - name: zmk-feature-module-physical-layout
    - name: zmk-feature-default-layer
      revision: codex/custom-rpc-rewrite
    - name: zmk-feature-os-detection
      import: true
    - name: zmk-feature-runtime-macro
      import: true
    - name: zmk-feature-runtime-combo
      import: true
    - name: zmk-feature-kscan-diagnostics
    - name: zmk-board-eyelash
      remote: a741725193
      revision: v4.0
    - name: zmk-tog-io
      remote: a741725193
      revision: main
    - name: prospector-zmk-module
      remote: tokyo2006
      revision: main
  self:
    path: config
