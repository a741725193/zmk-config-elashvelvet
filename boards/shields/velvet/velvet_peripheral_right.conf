# === Peripheral right (no USB, no Studio RPC, has PMW3610 trackball) ===
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=y

# Settings relay (so the central can sync settings)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Custom settings relay (sync PMW3610 settings to/from the central)
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# Keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Trackball: PMW3610 (sensor is on this half)
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY=y
