# === Peripheral right (no USB, no Studio RPC, has TPS43 trackpad) ===
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=y

# Settings relay (so the central can sync settings)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Custom settings relay (sync trackpad settings to/from the central)
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# Keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Trackpad: TPS43 (Azoteq IQS5xx) — I2C0 is on this half
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_I2C=y
CONFIG_ZMK_TPS43=y
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# Trackball: PMW3610 (disabled on this branch, trackpad replaces it)
# CONFIG_INPUT=y
# CONFIG_ZMK_POINTING=y
# CONFIG_PMW3610=y
