CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

# PMW3610 — cormoran DYA-aware driver
# Old CONFIG_PMW3610_REPORT_INTERVAL_MIN / SWAP_XY / INIT_POWER_UP_EXTRA_DELAY_MS
# still work; cormoran driver also exposes CONFIG_ZMK_PMW3610_STUDIO_RPC for
# runtime CPI/rotation/awake-time editing from DYA Studio's Trackball tab.
CONFIG_PMW3610=y
CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=n
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=200
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_SPI=y

# NFC pins as GPIO moved from Kconfig to devicetree in Zephyr 4.1.
# The actual &uicr { nfct-pins-as-gpios; } line lives in the shield .dtsi or
# in a per-board overlay (see ZMK 4.1 migration guide, section 11.5.2).
# The CONFIG_NFCT_PINS_AS_GPIOS=y symbol no longer exists — do NOT add it back.

CONFIG_ZMK_BLE=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_STUDIO=y

# === DYA Studio — Connection ===
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# === DYA Studio — Battery ===
# (ZMK 4.1 DYA Studio's Diagnostics tab reads battery via ZMK_DEVICE_INFO;
# CONFIG_ZMK_BATTERY_HISTORY is still supported for history, but is opt-in.)
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n

# === DYA Studio — Trackball / Runtime Input Processor ===
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# === DYA Studio — Settings ===
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# === DYA Studio — Custom Settings (required by some feature modules) ===
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# === DYA Studio — Runtime Macro / Combo ===
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# === DYA Studio — Fast Keymap identifiers ===
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# === DYA Studio — Diagnostics (Device Info / Watchdog) ===
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# === DYA Studio — Runtime Sensor Rotate (encoder) ===
# ZMK 4.1 + DYA: the rotation config is now persisted via Custom Settings,
# so the encoder becomes editable from the Settings tab in DYA Studio.
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# === Split + relay ===
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# === Stack/buffer values required when using multiple feature modules ===
# (Recommended baseline from DYA Studio developer guide.)
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
